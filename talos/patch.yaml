cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
machine:
  install:
    image: factory.talos.dev/nocloud-installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b:v1.11.0
  kubelet:
    # Note: this is a workaround to fix the issue, where the kubelet fails to create pods after draining a node
    extraArgs:
      runtime-request-timeout: "10m"
    # Longhorn system mounts
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
  sysctls:
    vm.nr_hugepages: "1024" 
    vm.max_map_count: "262144"
  kernel:
    modules:
      - name: nvme_tcp # Enable NVMe over TCP (for Longhorn)
      - name: vfio_pci # Enable VFIO PCI passthrough (for GPU passthrough)

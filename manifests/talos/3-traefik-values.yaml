additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
  - "--log.level=INFO"
  - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=7200s"
  - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=7200s"
  - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=1800s"

deployment:
  enabled: true
  replicas: 3
  annotations: {}
  podAnnotations: {}
  additionalContainers: []
  initContainers: []

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: [web, websecure]
    matchRule: Host(`traefik.local.bnbdevelopment.hu`)

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-external
    allowExternalNameServices: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: false

rbac:
  enabled: true

service:
  enabled: true
  type: LoadBalancer
  annotations:
    io.cilium/lb-ipam-ips: 192.168.88.105
  labels: {}
  spec:
    loadBalancerIP: 192.168.88.105
  loadBalancerSourceRanges: []
  externalIPs: []

metrics:
  prometheus:
    serviceMonitor:
      enabled: true
      namespace: monitoring

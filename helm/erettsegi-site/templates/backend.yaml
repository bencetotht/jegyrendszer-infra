---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erettsegi-backend
  namespace: {{.Values.namespace}}
  labels:
    # app: erettsegi-backend
    app.kubernetes.io/instance: erettsegib-release
    app.kubernetes.io/name: erettsegib
    pod-security.kubernetes.io/audit: baseline
spec:
  replicas: {{.Values.backend.replicas}}
  selector:
    matchLabels:
      # app: erettsegi-backend
      app.kubernetes.io/instance: erettsegib-release
      app.kubernetes.io/name: erettsegib
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        # app: erettsegi-backend
        app.kubernetes.io/instance: erettsegib-release
        app.kubernetes.io/name: erettsegib
    spec:
      serviceAccountName: erettsegi-backend-svc-a
      imagePullSecrets:
      - name: regcred-bnb
      containers:
      - name: erettsegi-backend
        image: "{{.Values.backend.image}}:{{.Values.backend.tag}}" 
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        ports:
        - containerPort: 3000
          name: backend-open
        volumeMounts:
        - name: logs
          mountPath: /logs/
        envFrom:
        - secretRef:
            name: erettsegi-site-sm
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REDIS
          value: {{ .Values.uri.redis }}
        - name: MONGO
          value: {{ .Values.uri.mongo }}
{{ if .Values.development }}
        - name: NODE_ENV
          value: "development"
{{ else }}
        - name: NODE_ENV
          value: "production"
{{ end }}
        securityContext:
          allowPrivilegeEscalation: false
{{ if .Values.backend.livenessProbe }}
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 2
{{ end }}
{{ if .Values.backend.startupProbe }}
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          failureThreshold: 3
          periodSeconds: 10
{{ end }}
{{ if .Values.backend.filebeat.enabled }}
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.11.0
        imagePullPolicy: Always
        args: [
          "-c", "/etc/filebeat.yml",
          "-e",
        ]
        env:
        - name: ELASTICSEARCH_HOSTS
          value: {{ .Values.backend.filebeat.elasticsearch_hosts }}
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.filebeat.secret_name }}
              key: username
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.filebeat.secret_name }}
              key: password
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: logs
          mountPath: /var/log/app
          readOnly: true
        - name: filebeat-config
          mountPath: /etc/filebeat.yml
          subPath: filebeat.yml
          readOnly: true
        - name: filebeat-data
          mountPath: /usr/share/filebeat/data
        securityContext:
          runAsUser: 0
{{ end }}
      volumes:
      - name: logs
        emptyDir: {}
      - name: filebeat-config
        configMap:
          name: filebeat-config
          defaultMode: 0600
      - name: filebeat-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: erettsegi-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/instance: erettsegib-release
    app.kubernetes.io/name: erettsegib
spec:
  selector:
    app.kubernetes.io/instance: erettsegib-release
    app.kubernetes.io/name: erettsegib
  ports:
  - name: backend-open
    port: 3000
    protocol: TCP
    targetPort: backend-open
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erettsegi-backend-svc-a
  namespace: {{ .Values.namespace }}
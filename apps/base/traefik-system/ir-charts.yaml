---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: oci-transport
  namespace: traefik-system
spec:
  serverName: europe-west3-docker.pkg.dev
  insecureSkipVerify: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: charts-oci
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`charts.bnbdevelopment.hu`)
      kind: Rule
      services:
        - name: oci-forward
          port: 443
          scheme: https
          serversTransport: oci-transport
---
apiVersion: v1
kind: Service
metadata:
  name: oci-forward
  namespace: traefik-system
spec:
  type: ExternalName
  externalName: europe-west3-docker.pkg.dev
  ports:
    - port: 443
      protocol: TCP

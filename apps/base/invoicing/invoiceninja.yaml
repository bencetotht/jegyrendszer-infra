---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: invoiceninja
  namespace: invoicing
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: invoiceninja
      version: 0.10.2
      sourceRef:
        kind: HelmRepository
        name: bnb-charts
        namespace: flux-system
      interval: 1m
  values:
    global:
      storageClass: longhorn

    userEmail: admin@bnbdevelopment.hu
    # existing secret for APP_KEY and IN_PASSWORD
    existingSecret: invoiceninja-creds

    # redis configuration
    redis:
      enabled: false
    externalRedis:
      host: 192.168.88.50
      # existing secret for redis-password key
      existingSecret: invoiceninja-redis-creds
      databases:
        default: "10"
        cache: "11"

    # MariaDB configuration
    mariadb:
      enabled: false
    externalDatabase:
      host: 192.168.88.47
      user: invoiceninja
      database: invoiceninja
      # existing secret must contain mariadb-password key
      existingSecret: invoiceninja-db-creds

    nginx:
      enabled: false

    # persistent volume configuration
    persistence:
      storage:
        accessModes:
          - ReadWriteMany
        size: 10Gi
      public:
        accessModes:
          - ReadWriteMany
        size: 1Gi

    # ingress configuration
    ingress:
      enabled: false # disable default ingress
      tls: true
      hostname: invoiceninja.local
      traefikCRD:
        enabled: true
---
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: invoiceninja-ingressroute
  namespace: traefik-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`invoice.local.bnbdevelopment.hu`) && PathPrefix(`/`)"
      middlewares:
        - name: redirect-middleware
          namespace: traefik-system
      services:
        - name: invoiceninja-web
          port: 8080
          namespace: invoicing
  tls:
    secretName: local-bnbdevelopment-hu-tls
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: invoiceninja
  namespace: invoicing
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: invoiceninja
      version: 0.10.2
      sourceRef:
        kind: HelmRepository
        name: invoiceninja
        namespace: flux-system
      interval: 1m
  values:
    global:
      storageClass: longhorn
    
    userEmail: admin@bnbdevelopment.hu
    # existing secret for APP_KEY and IN_PASSWORD
    existingSecret: invoiceninja-creds

    # redis configuration
    redis:
      enabled: false
    externalRedis:
      host: 192.168.88.50
      password: root
      databases:
        default: 10
        cache: 11

     # MariaDB configuration
    mariadb:
      enabled: false
    externalDatabase:
      host: 192.168.88.47
      user: invoiceninja
      database: invoiceninja
      # existing secret must contain mariadb-password key
      existingSecret: invoiceninja-db-creds

    nginx:
      enabled: false
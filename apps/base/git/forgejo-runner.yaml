---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: forgejo-runner-helm
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://codeberg.org/wrenix/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: git
  labels:
    env.skip: cloud
spec:
  dependsOn:
    - name: forgejo
  interval: 5m
  chart:
    spec:
      chart: forgejo-runner
      version: "0.7.3"
      sourceRef:
        kind: HelmRepository
        name: forgejo-runner-helm
        namespace: flux-system
      interval: 1m
  values:
    replicaCount: 1

    serviceAccount:
      create: true
      name: forgejo-runner

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    dind:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi

    runner:
      config:
        existingInitSecret: forgejo-runner-init
        instance: https://git.bnbdevelopment.hu
        file:
          log:
            level: info
            job_level: info
          runner:
            capacity: 2
            envs:
              DOCKER_HOST: tcp://127.0.0.1:2376
              DOCKER_CERT_PATH: /certs/client
              DOCKER_TLS_VERIFY: "1"
            labels:
              - ubuntu-latest:docker://node:22-bookworm
              - ubuntu-22.04:docker://node:22-bookworm
              - ubuntu-24.04:docker://node:22-bookworm
              - docker:docker://node:22-bookworm
          cache:
            enabled: true
          container:
            network: host
            privileged: true
            options: -v /certs/client:/certs/client
            valid_volumes:
              - /certs/client
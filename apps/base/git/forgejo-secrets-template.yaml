# Template secrets for the Forgejo deployment in this directory.
# Do not commit real secret values.
#
# Apply these only after replacing the placeholders, or recreate them with your
# preferred secret management flow (SealedSecret, ExternalSecret, SOPS, etc).

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin-secret
  namespace: git
type: Opaque
stringData:
  username: forgejo-admin
  password: "replace-me"

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-init
  namespace: runner
type: Opaque
stringData:
  .runner: |
    {
      "WARNING": "This file is automatically generated by forgejo-runner. Do not edit it manually unless you know what you are doing. Removing this file will cause act runner to re-register as a new runner.",
      "id": 0,
      "uuid": "brother",
      "name": "bnb-cluster",
      "token": "thank-you-codex-for-exposing-my-token",
      "address": "https://git.bnbdevelopment.hu/",
      "labels": [
        "ubuntu-latest:docker://node:22-bookworm",
        "ubuntu-22.04:docker://node:22-bookworm",
        "ubuntu-24.04:docker://node:22-bookworm",
        "docker:docker://node:22-bookworm"
      ]
    }

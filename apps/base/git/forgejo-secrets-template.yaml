# Template secrets for the Forgejo deployment in this directory.
# Do not commit real secret values.
#
# Apply these only after replacing the placeholders, or recreate them with your
# preferred secret management flow (SealedSecret, ExternalSecret, SOPS, etc).

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin-secret
  namespace: git
type: Opaque
stringData:
  username: forgejo-admin
  password: "replace-me"

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-init
  namespace: git
type: Opaque
stringData:
  # Kept for compatibility with the current HelmRelease name, but this secret
  # no longer stores CONFIG_* registration fields.
  #
  # The chart still expects a mounted legacy .runner file path to exist, so we
  # provide an empty placeholder and configure the real connection below via
  # server.connections + token_url.
  .runner: ""
  token: "replace-me"

# Template secrets for the Forgejo deployment in this directory.
# Do not commit real secret values.
#
# Apply these only after replacing the placeholders, or recreate them with your
# preferred secret management flow (SealedSecret, ExternalSecret, SOPS, etc).

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin-secret
  namespace: git
type: Opaque
stringData:
  username: forgejo-admin
  password: "replace-me"

---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-init
  namespace: git
type: Opaque
stringData:
  CONFIG_INSTANCE: https://git.bnbdevelopment.hu
  CONFIG_NAME: git-runner-01
  # Create this after Forgejo is up from: /admin/actions/runners
  CONFIG_TOKEN: "replace-me"

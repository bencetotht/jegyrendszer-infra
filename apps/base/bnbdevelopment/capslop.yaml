apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: capstone-project-server
  namespace: flux-system
  labels:
    env.skip: cloud
spec:
  image: ghcr.io/bencetotht/capstone-project-server
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: capstone-project-server
  namespace: flux-system
  labels:
    env.skip: cloud
spec:
  imageRepositoryRef:
    name: capstone-project-server
  policy:
    semver:
      range: 1.x.x
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-svc-a
  namespace: bnb
  labels:
    env.skip: cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capslop-server
  namespace: bnb
  labels:
    app.kubernetes.io/name: capslop-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capslop-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capslop-server
    spec:
      containers:
        - name: capslop-server
          image: ghcr.io/bencetotht/capstone-project-server:main # {"$imagepolicy": "flux-system:capstone-project-server"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INFLUXDB_URL
              valueFrom:
                secretKeyRef:
                  name: capslop-server-secrets
                  key: INFLUXDB_URL
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capslop-server-secrets
                  key: INFLUXDB_TOKEN
            - name: INFLUXDB_ORG
              valueFrom:
                secretKeyRef:
                  name: capslop-server-secrets
                  key: INFLUXDB_ORG
            - name: INFLUXDB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: capslop-server-secrets
                  key: INFLUXDB_BUCKET
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: capslop-server-secrets
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: capslop-server
  namespace: bnb
  labels:
    app.kubernetes.io/name: capslop-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: capslop-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capslop-server-ingressroute
  namespace: bnb
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: "Host(`capslop.bnbdevelopment.hu`) && PathPrefix(`/`)"
      services:
        - name: capslop-server
          port: 80

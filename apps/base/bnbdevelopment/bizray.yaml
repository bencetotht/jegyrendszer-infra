---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: bizray-frontend
  namespace: flux-system
spec:
  image: europe-west3-docker.pkg.dev/bnbdevelopment/bizray/bizray-frontend
  interval: 5m
  secretRef:
    name: regcred-bnb
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: bizray-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bizray-frontend
  policy:
    semver:
      range: 1.x.x
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: bizray-backend
  namespace: flux-system
spec:
  image: europe-west3-docker.pkg.dev/bnbdevelopment/bizray/bizray-backend
  interval: 5m
  secretRef:
    name: regcred-bnb
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: bizray-backend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bizray-backend
  policy:
    semver:
      range: 1.x.x

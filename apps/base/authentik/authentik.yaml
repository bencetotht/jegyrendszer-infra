apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: '2025.8.1'
      sourceRef:
        kind: HelmRepository
        name: authentik-repo
        namespace: flux-system
      interval: 1m
  values:
    authentik:
      secret_key: "env://AUTHENTIK_SECRET_KEY"
      error_reporting:
        enabled: true

      postgresql:
        host: 192.168.88.50
        port: 5432
        database: authentikdb
        name: "env://AUTHENTIK_POSTGRES_USER"
        password: "env://AUTHENTIK_POSTGRES_PASSWORD"

      redis:
        host: 192.168.88.50
        password: "env://AUTHENTIK_REDIS_PASSWORD"

      email:
        host: "mail.bnbdevelopment.hu"
        port: 587
        username: "auth@bnbdevelopment.hu"
        password: "env://AUTHENTIK_EMAIL_PASSWORD"
        use_tls: false
        use_ssl: true
        timeout: 30
        from: "auth <auth@bnbdevelopment.hu>"

    server:
      ingress:
        ingressClassName: traefik
        enabled: true
        hosts:
          - auth.bnbdevelopment.hu

      env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-app-creds
            key: secret_key
      - name: AUTHENTIK_POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: authentik-db-creds
            key: postgresql-user
      - name: AUTHENTIK_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-creds
            key: postgresql-password
      - name: AUTHENTIK_REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-redis-creds
            key: redis-password
      - name: AUTHENTIK_REDIS__DB
        value: "2"
      - name: AUTHENTIK_EMAIL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-email-creds
            key: password

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespace: monitoring

      replicas: 2
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 5

    worker:
      env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-app-creds
            key: secret_key
      - name: AUTHENTIK_POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: authentik-db-creds
            key: postgresql-user
      - name: AUTHENTIK_POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-creds
            key: postgresql-password
      - name: AUTHENTIK_REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-redis-creds
            key: redis-password
      - name: AUTHENTIK_REDIS__DB
        value: "2"
      - name: AUTHENTIK_EMAIL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-email-creds
            key: password

      replicas: 1
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 5

    postgresql:
      enabled: false
    redis:
      enabled: false

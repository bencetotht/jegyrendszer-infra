---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: elk-logstash
  namespace: logging
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: logstash
      version: '8.5.1'
      sourceRef:
        kind: HelmRepository
        name: elastic-repo
        namespace: flux-system
      interval: 1m

  values:
    extraEnvs:
    - name: "ELASTICSEARCH_USERNAME"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: username
    - name: "ELASTICSEARCH_PASSWORD"
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-credentials
          key: password

    logstashConfig:
      logstash.yml: |
        http.host: 0.0.0.0
        xpack.monitoring.enabled: false

    logstashPipeline:
      logstash.conf: |
        input {
          beats {
            port => 5044
          }
        }

        output {
          elasticsearch {
            hosts => ["https://elasticsearch-master:9200"]
            cacert => "/usr/share/logstash/config/elasticsearch-master-certs/ca.crt"
            user => '${ELASTICSEARCH_USERNAME}'
            password => '${ELASTICSEARCH_PASSWORD}'
          }
        }

    secretMounts:
      - name: "elasticsearch-master-certs"
        secretName: "elasticsearch-master-certs"
        path: "/usr/share/logstash/config/elasticsearch-master-certs"

    service:
      type: ClusterIP
      ports:
        - name: beats
          port: 5044
          protocol: TCP
          targetPort: 5044
        - name: http
          port: 8080
          protocol: TCP
          targetPort: 8080

    resources:
      requests:
        cpu: "200m"
        memory: "200Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi" 
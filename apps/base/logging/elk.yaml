---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: elk-elasticsearch
  namespace: logging
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: elasticsearch
      version: '8.5.1'
      sourceRef:
        kind: HelmRepository
        name: elastic-repo
        namespace: flux-system
      interval: 1m

  values:
    resources:
      requests:
        cpu: "200m"
        memory: "200Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

    antiAffinity: "soft"
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: elk-kibana
  namespace: logging
  labels:
    env.skip: cloud
spec:
  interval: 5m

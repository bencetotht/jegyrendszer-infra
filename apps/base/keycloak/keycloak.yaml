apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: keycloak
      version: '24.8.1'
      sourceRef:
        kind: HelmRepository
        name: bitnami-repo
        namespace: flux-system
      interval: 1m
  values:
    global:
      defaultStorageClass: longhorn
    postgresql:
      enabled: false
    externalDatabase:
      existingSecret: keycloak-postgresql
      existingSecretHostKey: POSTGRES_HOST
      existingSecretPortKey: POSTGRES_PORT
      existingSecretUserKey: POSTGRES_USER
      existingSecretPasswordKey: POSTGRES_PASSWORD
      existingSecretDatabaseKey: POSTGRES_DB
      # host: keycloak-postgresql.service.svc.cluster.local
      # port: 5432
      # user: postgres
      # password: postgres
      # database: keycloak
      # schema: public
    auth:
      existingSecret: keycloak-auth
      existingSecretPasswordKey: adminpassword
    replicaCount: 2
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring
      prometheusRule:
        enabled: false
        namespace: monitoring

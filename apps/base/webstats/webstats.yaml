apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: webstats
  namespace: webstats
spec:
  chart:
    spec:
      chart: ./helm/webstats
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  interval: 10m0s
  values:
    namespace: webstats
    frontend:
      replicas: 1
      port: 3000
      livenessProbe: false
      startupProbe: false
      backend_url: http://webstats-backend.webstats.svc.cluster.local:3000
      image: europe-west3-docker.pkg.dev/bnbdevelopment/webstats/frontend # {"$imagepolicy": "flux-system:webstats-frontend:name"}
      tag: 1.0.11 # {"$imagepolicy": "flux-system:webstats-frontend:tag"}
    backend:
      replicas: 1
      port: 3000
      prefix: /api/v1
      livenessProbe: true
      startupProbe: true
      image: europe-west3-docker.pkg.dev/bnbdevelopment/webstats/backend # {"$imagepolicy": "flux-system:webstats-backend:name"}
      tag: 1.0.15 # {"$imagepolicy": "flux-system:webstats-backend:tag"}
      autoscale:
        enabled: true
        minReplicas: 1
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80
      metrics:
        enabled: true
        servicemonitor:
          enabled: true
          namespace: monitoring
    ingress:
      enabled: true
      ingressclass: traefik-external
      host: stats.bnbdevelopment.hu

---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: clickstack
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 1m
  values:
    # Global settings
    global:
      storageClassName: longhorn
      keepPVC: false

    # HyperDX service configuration
    hyperdx:
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 250m
          memory: 512Mi

      env:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: hyperdx-secret
            key: API_KEY

      frontendUrl: "https://clickhouse.local.bnbdevelopment.hu"
      logLevel: "info"
      usageStatsEnabled: false

      ingress:
        enabled: true
        className: traefik-external
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: hyperdx.local
            paths:
              - path: /
                pathType: Prefix
    # MongoDB configuration
    mongodb:
      # MongoDB requires AVX support - only available on worker-3
      nodeSelector:
        kubernetes.io/hostname: worker-3

      persistence:
        enabled: true
        size: 10Gi

      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

    # ClickHouse configuration
    clickhouse:
      persistence:
        data:
          enabled: true
          size: 10Gi
        logs:
          enabled: true
          size: 5Gi

      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 512Mi

      users:
        app:
          password: "hyperdx"
        otelCollector:
          password: "otelcollectorpass"

    # OTEL Collector configuration
    otelCollector:
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

      # Use internal ClickHouse
      externalClickHouse:
        enabled: false

    # Scheduled tasks
    tasks:
      checkAlerts:
        enabled: true
        schedule: "*/1 * * * *"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack-ingress
  namespace: traefik-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: "Host(`clickhouse.local.bnbdevelopment.hu`) && PathPrefix(`/`)"
      services:
        - name: clickstack-app
          port: 3000
          namespace: monitoring
  tls:
    secretName: local-bnbdevelopment-hu-tls
---
# Custom ClickHouse Config - Adds cluster definition for single-node setup
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-clickhouse-config
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
data:
  config.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <remote_servers>
            <!-- Dummy cluster for single-node setup, required by SigNoz migrator -->
            <cluster>
                <shard>
                    <replica>
                        <host>localhost</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </cluster>
        </remote_servers>
    </clickhouse>
---
# Custom ClickHouse Users ConfigMap - Overrides ClickStack defaults
# This gives the "app" user full permissions needed for SigNoz schema migration
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-clickhouse-users
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
data:
  users.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage>10000000000</max_memory_usage>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>in_order</load_balancing>
                <log_queries>1</log_queries>
            </default>
            <readonly>
                <readonly>2</readonly>
            </readonly>
        </profiles>

        <users>
            <default>
                <password></password>
                <profile>default</profile>
                <networks>
                    <ip>::1</ip>
                    <ip>127.0.0.1</ip>
                </networks>
                <quota>default</quota>
            </default>

            <!-- App user with full permissions for SigNoz -->
            <app>
                <password>hyperdx</password>
                <networks>
                    <ip>10.0.0.0/8</ip>
                    <ip>172.16.0.0/12</ip>
                    <ip>192.168.0.0/16</ip>
                    <host_regexp>.*\.svc\.cluster\.local$</host_regexp>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <grants>
                    <query>GRANT ALL ON *.*</query>
                </grants>
            </app>

            <!-- OtelCollector user with full permissions -->
            <otelcollector>
                <password>otelcollectorpass</password>
                <networks>
                    <ip>10.0.0.0/8</ip>
                    <ip>172.16.0.0/12</ip>
                    <ip>192.168.0.0/16</ip>
                    <host_regexp>.*\.svc\.cluster\.local$</host_regexp>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <grants>
                    <query>GRANT ALL ON *.*</query>
                </grants>
            </otelcollector>
        </users>

        <quotas>
            <default>
                <interval>
                    <duration>3600</duration>
                    <queries>0</queries>
                    <errors>0</errors>
                    <result_rows>0</result_rows>
                    <read_rows>0</read_rows>
                    <execution_time>0</execution_time>
                </interval>
            </default>
        </quotas>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    io.cilium/lb-ipam-ips: 192.168.88.101
  name: clickstack-lb
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
  - name: native
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: prometheus
    port: 9363
    protocol: TCP
    targetPort: 9363
  selector:
    app: clickhouse
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
  type: LoadBalancer
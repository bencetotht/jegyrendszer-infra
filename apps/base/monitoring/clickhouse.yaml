---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: clickstack
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 1m
  values:
    # Global settings
    global:
      storageClassName: longhorn
      keepPVC: false

    # HyperDX service configuration
    hyperdx:
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 250m
          memory: 512Mi

      env:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: hyperdx-secret
            key: API_KEY

      frontendUrl: "https://clickhouse.local.bnbdevelopment.hu"
      logLevel: "info"
      usageStatsEnabled: false

      ingress:
        enabled: true
        className: traefik-external
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: hyperdx.local
            paths:
              - path: /
                pathType: Prefix
    # MongoDB configuration
    mongodb:
      # MongoDB requires AVX support - only available on worker-3
      nodeSelector:
        kubernetes.io/hostname: worker-3

      persistence:
        enabled: true
        size: 10Gi

      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

    # ClickHouse configuration
    clickhouse:
      persistence:
        data:
          enabled: true
          size: 10Gi
        logs:
          enabled: true
          size: 5Gi

      resources:
        limits:
          cpu: 1000m
          memory: 2Gi
        requests:
          cpu: 250m
          memory: 512Mi

      users:
        app:
          password: "clickhouse"  # TODO: Change in production
        otelCollector:
          password: "otelcollector"  # TODO: Change in production

    # OTEL Collector configuration
    otelCollector:
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

      # Use internal ClickHouse
      externalClickHouse:
        enabled: false

    # Scheduled tasks
    tasks:
      checkAlerts:
        enabled: true
        schedule: "*/1 * * * *"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack-ingress
  namespace: traefik-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: "Host(`clickhouse.local.bnbdevelopment.hu`) && PathPrefix(`/`)"
      services:
        - name: clickstack-app
          port: 3000
          namespace: monitoring
  tls:
    secretName: local-bnbdevelopment-hu-tls
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    io.cilium/lb-ipam-ips: 192.168.88.101
  name: clickstack-lb
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
  - name: native
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: prometheus
    port: 9363
    protocol: TCP
    targetPort: 9363
  selector:
    app: clickhouse
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
  type: LoadBalancer
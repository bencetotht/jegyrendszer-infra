---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: clickstack
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: clickstack
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: clickstack
        namespace: flux-system
      interval: 1m
  # This is a workaround to get the cluster configuration working
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: clickstack-clickhouse
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: cluster-config
                  mountPath: /etc/clickhouse-server/config.d/cluster.xml
                  subPath: cluster.xml
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: resource-config
                  mountPath: /etc/clickhouse-server/config.d/resource-limits.xml
                  subPath: resource-limits.xml
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: cluster-config
                  configMap:
                    name: clickstack-clickhouse-cluster-config
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: resource-config
                  configMap:
                    name: clickstack-clickhouse-resource-config
  values:
    # Global settings
    global:
      storageClassName: longhorn
      keepPVC: false

    # HyperDX service configuration
    hyperdx:
      resources:
        limits:
          cpu: 1000m
          memory: 2048Mi
        requests:
          cpu: 250m
          memory: 512Mi

      env:
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: hyperdx-secret
            key: API_KEY

      frontendUrl: "https://clickhouse.local.bnbdevelopment.hu"
      logLevel: "info"
      usageStatsEnabled: false

      ingress:
        enabled: true
        className: traefik-external
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - host: hyperdx.local
            paths:
              - path: /
                pathType: Prefix
    # MongoDB configuration
    mongodb:
      # MongoDB requires AVX support - only available on worker-3
      nodeSelector:
        kubernetes.io/hostname: worker-3

      persistence:
        enabled: true
        size: 10Gi

      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

    # ClickHouse configuration
    clickhouse:
      persistence:
        data:
          enabled: true
          size: 10Gi
        logs:
          enabled: true
          size: 5Gi

      resources:
        limits:
          cpu: 1000m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi

      users:
        app:
          password: "hyperdx"
        otelCollector:
          password: "otelcollectorpass"

    # OTEL Collector configuration
    otelCollector:
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

      # Use internal ClickHouse
      externalClickHouse:
        enabled: false

    # Scheduled tasks
    tasks:
      checkAlerts:
        enabled: true
        schedule: "*/1 * * * *"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack-ingress
  namespace: traefik-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: "Host(`clickhouse.local.bnbdevelopment.hu`) && PathPrefix(`/`)"
      services:
        - name: clickstack-app
          port: 3000
          namespace: monitoring
  tls:
    secretName: local-bnbdevelopment-hu-tls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-clickhouse-cluster-config
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
data:
  cluster.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <remote_servers>
            <cluster>
                <shard>
                    <internal_replication>false</internal_replication>
                    <replica>
                        <host>127.0.0.1</host>
                        <port>9000</port>
                    </replica>
                </shard>
            </cluster>
        </remote_servers>

        <zookeeper>
            <node index="1">
                <host>127.0.0.1</host>
                <port>9181</port>
            </node>
        </zookeeper>

        <keeper_server>
            <tcp_port>9181</tcp_port>
            <server_id>1</server_id>
            <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
            <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
            <coordination_settings>
                <operation_timeout_ms>10000</operation_timeout_ms>
                <session_timeout_ms>30000</session_timeout_ms>
                <raft_logs_level>warning</raft_logs_level>
            </coordination_settings>
            <raft_configuration>
                <server>
                    <id>1</id>
                    <hostname>127.0.0.1</hostname>
                    <port>9444</port>
                </server>
            </raft_configuration>
        </keeper_server>

        <distributed_ddl>
            <path>/clickhouse/task_queue/ddl_signoz</path>
        </distributed_ddl>
    </clickhouse>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-clickhouse-resource-config
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
data:
  resource-limits.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <!-- Keep caches proportional to container memory to avoid OOM kills. -->
        <uncompressed_cache_size>268435456</uncompressed_cache_size>
        <mark_cache_size>536870912</mark_cache_size>
        <max_server_memory_usage_to_ram_ratio>0.85</max_server_memory_usage_to_ram_ratio>
    </clickhouse>
---
# Custom ClickHouse Users ConfigMap - Overrides ClickStack defaults
# This gives the "app" user full permissions needed for SigNoz schema migration
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickstack-clickhouse-users
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
data:
  users.xml: |-
    <?xml version="1.0"?>
    <clickhouse>
        <profiles>
            <default>
                <max_memory_usage>1073741824</max_memory_usage>
                <max_memory_usage_for_user>2147483648</max_memory_usage_for_user>
                <max_memory_usage_for_all_queries>3221225472</max_memory_usage_for_all_queries>
                <use_uncompressed_cache>0</use_uncompressed_cache>
                <load_balancing>in_order</load_balancing>
                <log_queries>1</log_queries>
            </default>
            <readonly>
                <readonly>2</readonly>
            </readonly>
        </profiles>

        <users>
            <default>
                <password></password>
                <profile>default</profile>
                <networks>
                    <ip>::1</ip>
                    <ip>127.0.0.1</ip>
                </networks>
                <quota>default</quota>
            </default>

            <!-- App user with full permissions for SigNoz -->
            <app>
                <password>hyperdx</password>
                <networks>
                    <ip>10.0.0.0/8</ip>
                    <ip>172.16.0.0/12</ip>
                    <ip>192.168.0.0/16</ip>
                    <host_regexp>.*\.svc\.cluster\.local$</host_regexp>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <grants>
                    <query>GRANT CHECK, SHOW, SELECT, INSERT, ALTER, CREATE, DROP, UNDROP TABLE, TRUNCATE, OPTIMIZE, BACKUP, KILL QUERY, KILL TRANSACTION, MOVE PARTITION BETWEEN SHARDS, ROLE ADMIN, CREATE ROW POLICY, ALTER ROW POLICY, DROP ROW POLICY, CREATE QUOTA, ALTER QUOTA, DROP QUOTA, CREATE SETTINGS PROFILE, ALTER SETTINGS PROFILE, DROP SETTINGS PROFILE, ALLOW SQL SECURITY NONE, SHOW ACCESS, SYSTEM, dictGet, displaySecretsInShowAndSelect, INTROSPECTION, CLUSTER, FILE, URL, REMOTE, MONGO, REDIS, MYSQL, POSTGRES, SQLITE, ODBC, JDBC, HDFS, S3, HIVE, AZURE, KAFKA, NATS, RABBITMQ, SOURCES ON *.*</query>
                    <query>GRANT TABLE ENGINE ON *</query>
                </grants>
            </app>

            <!-- OtelCollector user with full permissions -->
            <otelcollector>
                <password>otelcollectorpass</password>
                <networks>
                    <ip>10.0.0.0/8</ip>
                    <ip>172.16.0.0/12</ip>
                    <ip>192.168.0.0/16</ip>
                    <host_regexp>.*\.svc\.cluster\.local$</host_regexp>
                </networks>
                <profile>default</profile>
                <quota>default</quota>
                <grants>
                    <query>GRANT ALL ON *.*</query>
                    <query>GRANT CLUSTER ON *.*</query>
                </grants>
            </otelcollector>
        </users>

        <quotas>
            <default>
                <interval>
                    <duration>3600</duration>
                    <queries>0</queries>
                    <errors>0</errors>
                    <result_rows>0</result_rows>
                    <read_rows>0</read_rows>
                    <execution_time>0</execution_time>
                </interval>
            </default>
        </quotas>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    io.cilium/lb-ipam-ips: 192.168.88.101
  name: clickstack-lb
  namespace: monitoring
spec:
  ports:
  - name: http
    port: 8123
    protocol: TCP
    targetPort: 8123
  - name: native
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: prometheus
    port: 9363
    protocol: TCP
    targetPort: 9363
  selector:
    app: clickhouse
    app.kubernetes.io/instance: clickstack
    app.kubernetes.io/name: clickstack
  type: LoadBalancer

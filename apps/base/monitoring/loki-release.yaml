apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: loki-release
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: '6.34.0'
      sourceRef:
        kind: HelmRepository
        name: grafana-repo
        namespace: flux-system
      interval: 1m
  values:
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
        - from: "2024-01-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: s3
          schema: v13
      auth_enabled: false
      storage_config:
        aws:
          region: eu-north-1
          buckenames: 

    deploymentMode: SingleBinary

    minio:
      enabled: false

    singleBinary:
      replicas: 1
      persistence:
        storageClass: longhorn
        accessModes:
          - ReadWriteOnce
        size: 10Gi

    read:
      replicas: 0
    backend:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: sentry
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: sentry
      version: 28.0.2
      sourceRef:
        kind: HelmRepository
        name: sentry
        namespace: flux-system
      interval: 1m
  values:
    user:
      create: true
      email: admin@bnbdevelopment.hu
      existingSecret: sentry-credentials

    system:
      url: https://sentry.bnbdevelopment.hu

    # Disable internal services - using external ones
    postgresql:
      enabled: false

    redis:
      enabled: false

    kafka:
      enabled: false

    clickhouse:
      enabled: false

    rabbitmq:
      enabled: false

    # External PostgreSQL configuration
    externalPostgresql:
      host: 192.168.88.50
      port: 5432
      username: sentry
      database: sentry
      existingSecret: sentry-credentials
      existingSecretKeys:
        password: postgres-password

    # External Redis configuration
    externalRedis:
      host: 192.168.88.50
      port: 6379
      db: 12
      ssl: false
      existingSecret: sentry-credentials
      existingSecretKeys:
        password: redis-password

    # External Kafka configuration
    externalKafka:
      host: "192.168.88.47"
      port: 9092
      compression:
        type: gzip
      # security:
      #   protocol: PLAINTEXT
      # sasl:
      #   mechanism: PLAIN
      #   username: ""
      #   password: ""

    # External ClickHouse configuration (in-cluster)
    externalClickhouse:
      host: clickstack-clickhouse.monitoring.svc.cluster.local
      tcpPort: 9000
      httpPort: 8123
      username: default
      password: ""
      database: default
      singleNode: true
      # existingSecret: sentry-credentials
      # existingSecretKeys:
      #   password: clickhouse-password

    # Ingress configuration
    ingress:
      enabled: false
      ingressClassName: traefik-external
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        cert-manager.io/cluster-issuer: letsencrypt-production
      hostname: sentry.bnbdevelopment.hu
      
    # Resource configuration
    sentry:
      web:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

      # Note: taskWorker (not worker) is the new taskworker component
      taskWorker:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          enabled: true
          exec:
            command:
              - test
              - -f
              - /tmp/health.txt
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3

      worker:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

      cron:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sentry
  namespace: traefik-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`sentry.bnbdevelopment.hu`) && PathPrefix(`/`)"
      services:
        - name: sentry-nginx
          port: 80
          namespace: monitoring

---
# Cloudflare tunnel scrape config
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: cloudflare-tunnel
  namespace: monitoring
  labels:
    prometheus: system-monitoring-prometheus
    release: prom
    env.skip: cloud
spec:
  staticConfigs:
    - labels:
        job: cloudflare_tunnel
      targets:
        - 192.168.88.41:60123
        - 192.168.88.42:60123
        - 192.168.88.43:60123
        - 192.168.88.44:60123
---
# Patroni scrape config
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: patroni
  namespace: monitoring
  labels:
    prometheus: system-monitoring-prometheus
    release: prom
    env.skip: cloud
spec:
  staticConfigs:
    - labels:
        job: patroni
      targets:
        - 192.168.88.56:8008
        - 192.168.88.57:8008
        - 192.168.88.58:8008
  scheme: HTTPS
  tlsConfig:
    insecureSkipVerify: true
---
# Postgres HA scrape config
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: postgres-ha
  namespace: monitoring
  labels:
    prometheus: system-monitoring-prometheus
    release: prom
    env.skip: cloud
spec:
  staticConfigs:
    - labels:
        job: postgres-ha
      targets:
        - 192.168.88.56:9187
        - 192.168.88.57:9187
        - 192.168.88.58:9187

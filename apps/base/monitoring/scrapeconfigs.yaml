---
# Nut exporter scrape config
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nut-exporter
  namespace: monitoring
  labels:
    prometheus: system-monitoring-prometheus
    release: prom
    env.skip: cloud
spec:
  staticConfigs:
    - labels:
        job: nut
      targets:
        - 192.168.88.253:3493
  metricsPath: /metrics
  honorTimestamps: true
  scrapeTimeout: 10s
  scrapeInterval: 30s
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: 192.168.88.253:9995
---
# Smartctl exporter scrape config
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: smartctl-exporter
  namespace: monitoring
  labels:
    prometheus: system-monitoring-prometheus
    release: prom
spec:
  staticConfigs:
    - labels:
        job: smartctl
      targets:
        - 192.168.88.253:9633
        - 192.168.88.250:9633
  metricsPath: /metrics

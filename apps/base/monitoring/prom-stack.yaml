---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-public
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: traefik-external
  labels:
    env.skip: cloud
spec:
  entryPoints:
    - web
    - websecure
  routes:
  - kind: Rule
    match: "Host(`grafana.bnbdevelopment.hu`) && PathPrefix(`/`)"
    services:
    - name: prometheus-release-grafana 
      port: 80
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: prometheus-release
  namespace: monitoring
  labels:
    env.skip: cloud
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '75.15.1'
      sourceRef:
        kind: HelmRepository
        name: prometheus-repo
        namespace: flux-system
      interval: 1m
  values:
    alertmanager:
      enabled: true
      config:
        receivers:
        - name: slack-receiver
          slack_configs:
          - api_url: "https://hooks.slack.com/services/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"
            channel: "#grafana-alerts"
            send_resolved: true
            text: >-
                {{ range .Alerts -}}
                *Alert:* {{ .Annotations.title }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
                *Description:* {{ .Annotations.description }}
                *Details:*
                  {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                  {{ end }}
                {{ end }}
    grafana:
      persistence:
        enabled: true
        storageClassName: "longhorn"
        accessModes:
          - ReadWriteMany
        annotations:
          helm.sh/resource-policy: "keep"
    prometheus:
      prometheusSpec:
        scrapeConfigSelector:
          matchLabels:
            release: prom
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}